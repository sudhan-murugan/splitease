# Render Blueprint: a Node web service + managed PostgreSQL.
# Deploy via Dashboard → New → Blueprint, pointing at this repo.
services:
  - type: web
    name: splitease-api
    runtime: node
    plan: free
    # --include=dev: the build needs the Nest CLI/TypeScript even though NODE_ENV=production
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: splitease-db
          property: connectionString
      - key: DB_SSL
        value: "false" # internal Render connection; set "true" for the external URL
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h

databases:
  - name: splitease-db
    plan: free
    databaseName: splitease
    user: splitease
